# Прогон тестов на каждый push и pull request.
#
# ВАЖНО, что именно здесь проверяется. Репозиторий не содержит data/ и
# uploads/ (они в .gitignore), поэтому CI работает в тех же условиях, что и
# облачная сессия: проверяется логика — роутер, лексикон, парсеры, разбор
# прайс-листа. Golden set при этом пропускается целиком, потому что без
# снимка каталога он не проверяет числа.
#
# Следствие: зелёная галочка здесь означает «код не сломан», но НЕ означает,
# что пройден Гейт §14 («ошибки в числах: 0»). Это доказывается только
# прогоном на машине со снимком каталога. См. README, «Два уровня проверки».
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: pytest -q

      - name: Напоминание про уровень проверки
        if: success()
        run: |
          echo "::notice::Пройден 1-й уровень (логика). Готовность к пилоту подтверждается только прогоном со снимком каталога — README, «Два уровня проверки»."
